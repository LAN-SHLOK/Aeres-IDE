<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeres IDE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <style>
      /* Instant splash to prevent white screen flash */
      html, body { margin: 0; padding: 0; background: #09090e; overflow: hidden; }
      #aeres-splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: #09090e;
        transition: opacity 0.4s ease;
      }
      #aeres-splash .logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 28px; font-weight: 800; color: #fffdf9;
        letter-spacing: -0.02em;
      }
      #aeres-splash .logo span { color: #c084fc; }
      #aeres-splash .spinner {
        margin-top: 24px; width: 28px; height: 28px;
        border: 3px solid #1e293b; border-top-color: #c084fc;
        border-radius: 50%;
        animation: aeres-spin 0.8s linear infinite;
      }
      @keyframes aeres-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="aeres-splash">
      <div class="logo">Aeres <span>IDE</span></div>
      <div class="spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
