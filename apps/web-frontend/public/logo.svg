<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161622;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0B0B12;stop-opacity:1" />
    </linearGradient>

    <!-- Logo Gradient (Purple to Pink) -->
    <linearGradient id="logoGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C084FC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F472B6;stop-opacity:1" />
    </linearGradient>

    <!-- Crossbar Highlight Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E879F9;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Subtle Inner Shadow for the background -->
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur2"/>
      <feOffset dx="0" dy="1"/>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.1"/>
      <feComposite in2="shadowDiff" operator="in"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Square Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" filter="url(#innerGlow)" />
  
  <!-- Outer Subtle Glow Ring -->
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#2D2D44" stroke-width="0.5" />

  <!-- Logo Group -->
  <g filter="url(#glow)">
    <!-- Main 'A' Body (Left and Right Legs) -->
    <path d="M 50 18 L 26 78 L 41 78 L 50 50 L 59 78 L 74 78 Z" fill="url(#logoGrad)" />
    
    <!-- Dynamic Crossbar (Blade) -->
    <path d="M 33 60 L 85 40 L 70 54 L 41 68 Z" fill="url(#bladeGrad)" />
    
    <!-- Left Leg Overlap Cut (To create the 3D ribbon effect) -->
    <path d="M 33 60 L 50 18 L 45 18 L 29 60 Z" fill="#E879F9" opacity="0.3" />
  </g>
</svg>
